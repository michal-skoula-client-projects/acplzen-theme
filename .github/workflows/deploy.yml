name: Build & publish deploy branch

# WP Pusher cannot build anything — it only pulls whatever is committed on the
# branch it tracks. This workflow builds and force-pushes the theme to a
# `deploy` branch that WP Pusher follows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialise publishes so two pushes can't race on the force-push.
concurrency:
  group: publish-deploy-branch
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  DEPLOY_BRANCH: deploy

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          # Need the parent commit to tell whether APP_VERSION moved with the
          # assets.
          fetch-depth: 2

      - name: Lint PHP
        run: |
          set -u
          find . -name '*.php' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Check APP_VERSION was bumped with the assets
        if: github.event_name == 'push'
        run: |
          set -u
          if ! git rev-parse --verify -q HEAD~1 >/dev/null; then
            echo 'No parent commit to compare against, skipping.'
            exit 0
          fi

          CHANGED="$(git diff --name-only HEAD~1 HEAD -- assets/styles assets/js)"
          if [ -z "$CHANGED" ]; then
            echo 'No asset source changes in this push.'
            exit 0
          fi

          if git diff -U0 HEAD~1 HEAD -- functions.php | grep -q '^[+-]const APP_VERSION'; then
            echo 'APP_VERSION moved with:'
            printf '%s\n' "$CHANGED"
            exit 0
          fi

          echo '::error::These asset sources changed but APP_VERSION in functions.php did not, so browsers will keep serving the files they already have. Bump it and push again.'
          printf '%s\n' "$CHANGED"
          exit 1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Assemble deploy payload
        run: |
          set -u # Fail on unknown variables
          PAYLOAD="$RUNNER_TEMP/payload"
          mkdir -p "$PAYLOAD"

          # Only copy over what is actually required. Pulls from .distignore.
          rsync -a \
            --exclude-from=.distignore \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.gitignore' \
            ./ "$PAYLOAD/"

          # The only generated file the theme needs. Without it the site
          # renders unstyled, so never publish a payload that lacks it.
          if [ ! -s "$PAYLOAD/assets/styles/output.css" ]; then
            echo '::error::deploy payload is missing assets/styles/output.css'
            exit 1
          fi

          echo "Payload size: $(du -sh "$PAYLOAD" | cut -f1)"

      - name: Publish to ${{ env.DEPLOY_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          cd "$RUNNER_TEMP/payload"

          # A fresh single-commit history each time. WP Pusher only ever 
          # looks at the tip commit, so discarding history costs nothing.
          git init -b "$DEPLOY_BRANCH"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Build ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          # This URL carries the token, -q silences it so it isn't printed.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$DEPLOY_BRANCH"

          # push -q hides which ref moved, so name it here.
          echo "Published $(git rev-parse --short HEAD) to $DEPLOY_BRANCH"
