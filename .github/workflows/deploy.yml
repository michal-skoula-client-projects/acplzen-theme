name: Build & publish deploy branch

# WP Pusher cannot build anything — it only pulls whatever is committed on the
# branch it tracks. This workflow builds and force-pushes the theme to a
# `deploy` branch that WP Pusher follows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialise publishes so two pushes can't race on the force-push.
concurrency:
  group: publish-deploy-branch
  cancel-in-progress: false

env:
  # Production runs at least PHP 8.2.29 (bitnami/wordpress). setup-php resolves
  # to the latest 8.2.x; the exact 8.2.29 target is pinned in composer.json via
  # config.platform.php so dependency resolution matches prod regardless.
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'
  DEPLOY_BRANCH: deploy

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@v4

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Assemble deploy payload
        run: |
          set -u # Fail on unknown variables
          PAYLOAD="$RUNNER_TEMP/payload"
          mkdir -p "$PAYLOAD"

          # Only copy over what is actually required. Pulls from .distignore.
          rsync -a \
            --exclude-from=.distignore \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.gitignore' \
            ./ "$PAYLOAD/"

          # Checks whether required theme files were generated.
          for REQUIRED_FILES in vendor/autoload_packages.php dist/.vite/manifest.json; do
            if [ ! -f "$PAYLOAD/$REQUIRED_FILES" ]; then
              echo "::error::deploy payload is missing $REQUIRED_FILES"
              exit 1
            fi
          done

          echo "Payload size: $(du -sh "$PAYLOAD" | cut -f1)"

      - name: Publish to ${{ env.DEPLOY_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          cd "$RUNNER_TEMP/payload"

          # A fresh single-commit history each time. WP Pusher only ever 
          # looks at the tip commit, so discarding history costs nothing.
          git init -b "$DEPLOY_BRANCH"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Build ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          # This URL carries the token, -q silences it so it isn't printed.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$DEPLOY_BRANCH"

          # push -q hides which ref moved, so name it here.
          echo "Published $(git rev-parse --short HEAD) to $DEPLOY_BRANCH"
