name: Build & publish deploy branch

# WP Pusher cannot build anything — it only pulls whatever is committed on the
# branch it tracks. `main` deliberately does not carry vendor/ or dist/, so this
# workflow builds both and force-pushes the result to a `deploy` branch that
# WP Pusher follows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialise publishes so two pushes can't race on the force-push.
concurrency:
  group: publish-deploy-branch
  cancel-in-progress: false

env:
  # Production runs PHP 8.2.29 (bitnami/wordpress). setup-php resolves to the
  # latest 8.2.x; the exact 8.2.29 target is pinned in composer.json via
  # config.platform.php so dependency resolution matches prod regardless.
  PHP_VERSION: '8.2'
  # Pinned to 22 on purpose: npm 11.20+ gates package install scripts behind
  # `allowScripts`, which blocks esbuild's postinstall and breaks `vite build`.
  NODE_VERSION: '22'
  DEPLOY_BRANCH: deploy

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@v4

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      # The real 8.2 syntax gate. This cannot be done on a dev machine running
      # 8.4 — `php -l` there happily parses 8.4-only syntax such as
      # parenthesis-less `new Foo()->bar()`, which is a fatal error on 8.2.
      - name: Syntax-check theme against PHP ${{ env.PHP_VERSION }}
        run: |
          find . \
            -path ./vendor -prune -o \
            -path ./node_modules -prune -o \
            -name '*.php' -print0 \
          | xargs -0 -r -n1 -P4 php -l

      - name: Validate composer manifest
        run: composer validate --strict --no-interaction

      - name: Install PHP dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      # Catches a dependency that needs a newer PHP, or a PHP extension the
      # bitnami/wordpress image might not ship (currently dom, filter, iconv).
      - name: Verify dependencies satisfy PHP ${{ env.PHP_VERSION }}
        run: composer check-platform-reqs

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Assemble deploy payload
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload"

          # .distignore is already the canonical "what must not ship" list,
          # so it doubles as the rsync exclude list. vendor/ and dist/ are only
          # absent from main via .gitignore, which rsync ignores — they are
          # copied here on purpose.
          rsync -a \
            --exclude-from=.distignore \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            ./ "$payload/"

          # Fail loudly rather than publishing a theme that white-screens.
          for required in \
            style.css \
            functions.php \
            vendor/autoload_packages.php \
            dist/.vite/manifest.json
          do
            if [ ! -f "$payload/$required" ]; then
              echo "::error::deploy payload is missing $required"
              exit 1
            fi
          done

          # Nothing excluded should have slipped through.
          for forbidden in node_modules resources composer.json package.json .gitignore; do
            if [ -e "$payload/$forbidden" ]; then
              echo "::error::deploy payload unexpectedly contains $forbidden"
              exit 1
            fi
          done

          echo "Payload size: $(du -sh "$payload" | cut -f1)"

      - name: Publish to ${{ env.DEPLOY_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/payload"

          # A fresh single-commit history each time, so the deploy branch never
          # accumulates 3 MB vendor blobs per build. WP Pusher only ever looks
          # at the tip commit, so discarding history costs nothing.
          git init -q -b "$DEPLOY_BRANCH"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Build ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$DEPLOY_BRANCH"

          echo "Published $(git rev-parse --short HEAD) to $DEPLOY_BRANCH"
